[project]
name = "wsp-sv"
version = "0.1.0"
description = "Testing weight-space edits on Swedish gender agreement in a small open LLM"
readme = "README.md"
authors = [
    { name = "Eric Leijonmarck" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.16.0",
    "datasets>=5.2.0",
    "huggingface-hub>=2.4.0",
    "lingua-language-detector>=2.2.0",
    "markdown>=3.11.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "peft>=0.21.3",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "xhtml2pdf>=0.2.28",
]
